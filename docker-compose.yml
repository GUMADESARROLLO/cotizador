services:
  cotizador:
    container_name: cn_cotizador
    image: kooldev/php:8.4-nginx-sqlsrv-prod
    restart: always
    volumes:
      - "./:/app/cotizador"
      - "./default.tmpl:/kool/default.tmpl"
    ports:
      - "8197:80"
    environment:
      - APP_NAME=cotizador
      - PHP_FPM_LISTEN=/run/php-fpm.sock
      - NGINX_LISTEN=80
      - NGINX_ROOT=/app/cotizador/public
      - NGINX_INDEX=index.php
      - NGINX_CLIENT_MAX_BODY_SIZE=150M
      - PHP_UPLOAD_MAX_FILESIZE=150M
      - PHP_POST_MAX_SIZE=150M
      - PHP_MEMORY_LIMIT=512M
      - NGINX_PHP_FPM=unix:/run/php-fpm.sock
      - NGINX_FASTCGI_READ_TIMEOUT=60s
      - NGINX_FASTCGI_BUFFERS=8 8k
      - NGINX_FASTCGI_BUFFER_SIZE=16k

  # Compila el CSS/JS (Vite) en public/build. No queda corriendo: se usa a demanda en cada despliegue
  #   docker compose run --rm assets
  # (public/build está en .gitignore; la imagen de PHP no trae Node).
  assets:
    image: node:22-alpine
    profiles: ["build"]
    working_dir: /app
    volumes:
      - "./:/app"
    command: sh -c "npm ci --no-audit --no-fund && npm run build"